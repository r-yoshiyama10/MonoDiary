services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monodiary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monodiary"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend
      target: dev
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      # .env の DATABASE_URL を上書き（コンテナ内ではホスト名が db になる）
      DATABASE_URL: postgres://postgres:password@db:5432/monodiary?sslmode=disable
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      # コンテナ内ではバックエンドのホスト名が app になる
      BACKEND_URL: http://app:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: http app:8080
    env_file:
      - ./.env
    ports:
      - "4040:4040"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
